<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory - Box 12</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.box{
    background:#fff;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    margin-top:0;
}

.summary{
    display:flex;
    gap:15px;
    margin:20px 0;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:180px;
    background:#f8f9fa;
    border-left:5px solid #0d6efd;
    border-radius:8px;
    padding:15px;
}

.card h2{
    margin:0;
    font-size:16px;
}

.card p{
    margin:10px 0 0;
    font-size:24px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#0d6efd;
    color:white;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f8f9fa;
}

.badge{
    color:white;
    padding:4px 10px;
    border-radius:15px;
    font-size:12px;
}

.working{
    background:#28a745;
}

.broken{
    background:#dc3545;
}

.notworking{
    background:#fd7e14;
}

.spare{
    background:#ffc107;
    color:#000;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:30px;
}
</style>

</head>

<body>

<div class="container">

<div class="box">

<h1>📦 Box 12</h1>

<p><strong>Description:</strong> New box</p>

<div class="summary">

<div class="card">
<h2>Total Items</h2>
<p>0</p>
</div>

<div class="card">
<h2>Working</h2>
<p>0</p>
</div>

<div class="card">
<h2>Broken</h2>
<p>0</p>
</div>

</div>

<table>

<thead>
<tr>
<th>#</th>
<th>Item</th>
<th>Category</th>
<th>Condition</th>
<th>Notes</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

</div>

<div class="footer">
Inventory Management • Box 12
</div>

</div>

</body>
</html>
